[package]
name = "mynote"
version = "1.0.2"
edition = "2021"
authors = ["MyNote Open Source Community"]
description = "A fast, lightweight, and super easy to use native Linux note-taking application"
license = "MIT"
readme = "README.md"

[dependencies]
libadwaita = { version = "0.9", features = ["v1_6"] }
gtk4 = { version = "0.11", features = ["v4_16"] }
glib = "0.22"
gio = "0.22"
pango = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
pulldown-cmark = "0.13"
dirs = "5.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
